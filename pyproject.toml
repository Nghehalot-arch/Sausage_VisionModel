[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sausage-vision"
version = "0.1.0"
description = "COCO-to-YOLO sausage instance segmentation pilot"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "Pillow>=10,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["ultralytics==8.4.157", "opencv-python==4.11.0.86", "contourpy==1.3.2", "matplotlib==3.10.3"]

[project.scripts]
sausage-vision = "sausage_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
